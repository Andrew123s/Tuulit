# Tuulit API on Cloudflare Workers (free plan is enough for launch volumes).
# Secrets are NOT in this file. Set them with:
#   wrangler secret put AI_API_KEY
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   (paste the whole JSON)
#   wrangler secret put MEDIA_SIGNING_KEY          (32+ random characters)
name = "tuulit-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "tuulit-prod"
FIREBASE_PROJECT_NUMBER = "759501570893"
APP_CHECK_MODE = "monitor"          # off | monitor | enforce  (enforce once Play Integrity is set up)
AI_PROVIDER = "openai_compatible"           # anthropic | openai_compatible
AI_MODEL = "gemini-3.6-flash"       # any model the provider offers; a small fast model keeps cost low
AI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
AI_DAILY_LIMIT = "60"               # questions per user per day
BREVO_SENDER_EMAIL = "hello@tuulit.app"
BREVO_SENDER_NAME = "Tuulit"
APP_NAME = "Tuulit"
PUBLIC_BASE_URL = "https://tuulit-api.mybeatstar.workers.dev"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tuulit-media"

[[kv_namespaces]]
binding = "RATE"
id = "b401cb9ba461485d9debaffc96020e43"

[observability]
enabled = true
