name: iOS

# Builds the native iOS app and runs every test on macOS:
#  - TuulitCore unit tests (swift test) on macOS and Linux
#  - app unit tests and UI tests on three iPhone sizes
# Firebase isn't configured in CI, so the app runs in local-only mode (as Android does without
# google-services.json). No secrets are needed.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: TuulitCore tests (Linux)
        working-directory: ios/Packages/TuulitCore
        run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: TuulitCore tests (macOS)
        working-directory: ios/Packages/TuulitCore
        run: swift test
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Tuulit.xcodeproj -scheme Tuulit             -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "TEST BUILD SUCCEEDED" build.log
      - name: Test on small, standard and large iPhones
        working-directory: ios
        run: |
          set -o pipefail
          DESTS=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for r, ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          def pick(pred):
              m = [d for d in devs if pred(d["name"])]
              return m[-1]["udid"] if m else None
          ids = [pick(lambda n: "SE" in n), pick(lambda n: n.endswith("Pro Max")), pick(lambda n: n.split()[-1].isdigit())]
          print(" ".join("-destination id=" + i for i in dict.fromkeys(x for x in ids if x)))')
          echo "Destinations: $DESTS"
          xcodebuild test-without-building -project Tuulit.xcodeproj -scheme Tuulit $DESTS             -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|Test Case.*failed|Executed|TEST (SUCCEEDED|FAILED)|Testing failed"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
            ios/build.log
