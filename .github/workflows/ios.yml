name: iOS

# Builds the native iOS app and runs every test on macOS:
#  - TuulitCore unit tests (swift test) on macOS and Linux
#  - app unit tests and UI tests on three iPhone sizes
# Firebase isn't configured in CI, so the app runs in local-only mode (as Android does without
# google-services.json). No secrets are needed.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: TuulitCore tests (Linux)
        working-directory: ios/Packages/TuulitCore
        run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: TuulitCore tests (macOS)
        working-directory: ios/Packages/TuulitCore
        run: swift test
      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Tuulit.xcodeproj -scheme Tuulit             -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "TEST BUILD SUCCEEDED" build.log
      - name: Pick simulators
        id: sims
        run: |
          xcrun simctl list devices available -j > devs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          devs = [d for r, ds in json.load(open("devs.json"))["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          def pick(pred):
              m = [d for d in devs if pred(d["name"])]
              return m[-1] if m else None
          small, large, std = pick(lambda n: "SE" in n), pick(lambda n: n.endswith("Pro Max")), pick(lambda n: n.split()[-1].isdigit())
          print("std=" + (std or large)["udid"])
          print("all=" + " ".join("-destination id=" + d["udid"] for d in dict.fromkeys(x["udid"] for x in [small, std, large] if x) and [x for x in [small, std, large] if x]))
          print("names=" + ", ".join(x["name"] for x in [small, std, large] if x))
          PY
          cat "$GITHUB_OUTPUT"
      - name: Unit tests (TuulitTests)
        timeout-minutes: 20
        working-directory: ios
        run: |
          set -o pipefail
          xcrun simctl boot ${{ steps.sims.outputs.std }} || true
          xcodebuild test-without-building -project Tuulit.xcodeproj -scheme Tuulit -only-testing:TuulitTests             -destination id=${{ steps.sims.outputs.std }} -test-timeouts-enabled YES -default-test-execution-time-allowance 120             -resultBundlePath UnitResults CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)|Testing failed|Failing tests"
      - name: UI tests on ${{ steps.sims.outputs.names }}
        timeout-minutes: 45
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Tuulit.xcodeproj -scheme Tuulit -only-testing:TuulitUITests             ${{ steps.sims.outputs.all }} -test-timeouts-enabled YES -default-test-execution-time-allowance 180             -maximum-concurrent-test-simulator-destinations 1             -resultBundlePath UIResults CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)|Testing failed|Failing tests"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/UnitResults.xcresult
            ios/UIResults.xcresult
            ios/unit.log
            ios/ui.log
            ios/build.log
